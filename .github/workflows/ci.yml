name: CI

# Garde-fou avant Render : ce qui aurait détecté le bug déjà rencontré
# ("Module not found: Can't resolve './calendly.js'") avant qu'il n'arrive en
# prod. Tourne sur chaque push et chaque pull request vers main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Même version que NODE_VERSION sur Render (render.yaml) — better-sqlite3
      # (module natif) casse sur des Node trop récents.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'

      - name: Installe les dépendances serveur
        run: npm install

      - name: Vérifie la syntaxe de tous les fichiers serveur
        run: npm run check

      # Le radar est un HTML autonome servi sous /radar : il n'entre ni dans le
      # build React ni dans check-syntax (qui ne scanne que server/ et
      # planning/backend/). Ces tests le chargent dans jsdom et vérifient
      # notamment le décodage des vecteurs écrits par le scraper Python.
      # => 3 de ces tests importent scrape_openmedias.py via python3 : sans les
      # dépendances pip, le script quitte à l'import ("Dépendances manquantes")
      # et le job échoue. Version légère suffisante (pas de torch ici).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: radar/scraper/requirements.txt

      - name: Dépendances Python du scraper (pour les tests radar)
        run: pip install requests beautifulsoup4 lxml openpyxl

      - name: Tests du radar éditorial
        run: npm run test:radar

      # planning/frontend/index.html est un HTML autonome de ~3900 lignes, hors
      # du build React et hors de check-syntax : sans ces tests, une régression
      # sur la navigation de mois ne se voit qu'en production.
      - name: Tests du planning (sélecteur de mois)
        run: npm run test:planning

      - name: Build du client React (aurait détecté le bug calendly.js)
        run: npm run build

      - name: Smoke test — le serveur démarre-t-il et répond-il ?
        run: npm run smoke
