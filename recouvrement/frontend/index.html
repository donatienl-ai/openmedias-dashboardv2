<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recouvrement — OpenMedias</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💶</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');

:root {
  --bg: #F1F4F9;
  --surface: #FFFFFF;
  --surface2: #F3F6FB;
  --border: #DEE6F0;
  --border-soft: #E8EEF6;
  --accent: #2563EB;
  --accent-light: #3B82F6;
  --accent-dim: rgba(37,99,235,0.08);
  --gold: #D97706; --gold-dim: rgba(217,119,6,0.10);
  --red: #DC2626; --red-dim: rgba(220,38,38,0.08);
  --green: #16A34A; --green-dim: rgba(22,163,74,0.08);
  --text: #101A2E; --text-dim: #50628A; --text-muted: #8C9CB8;
  /* Rayon + ombre relevés (18px/12px, ombre à vraie profondeur plutôt que
     quasi invisible) pour un rendu plus "élevé"/aéré façon macOS — même
     jeu de valeurs porté côté dashboard (client/src/styles.css, mêmes noms
     de variable) pour que les deux apps partagent littéralement les mêmes
     nombres au lieu de repartir de zéro sur chaque fichier. */
  --radius: 18px; --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(16,26,46,0.04), 0 10px 28px rgba(16,26,46,0.06);
  --shadow-lg: 0 24px 64px rgba(16,26,46,0.18);
  --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  /* Format palette */
  --plateau: #2563eb; --plateau-bg: #eff6ff;
  --immersion: #7c3aed; --immersion-bg: #f5f3ff;
  --artdigital: #059669; --artdigital-bg: #ecfdf5;
  --artprint: #ea580c; --artprint-bg: #fff7ed;
  --bdc: #F5D400; --bdc-bg: #fffce8; --bdc-text: #8A6D00;
}
[data-theme="dark"] {
  --bg: #050A14; --surface: #0B1322; --surface2: #101B30; --border: #1B2A45; --border-soft: #16223A;
  --accent: #3B82F6; --accent-light: #60A5FA; --accent-dim: rgba(59,130,246,0.14);
  --text: #FFFFFF; --text-dim: #8295B5; --text-muted: #54678A;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
  --plateau-bg: rgba(37,99,235,0.12); --immersion-bg: rgba(124,58,237,0.12);
  --artdigital-bg: rgba(5,150,105,0.12); --artprint-bg: rgba(234,88,12,0.12);
  --bdc-bg: rgba(245,212,0,0.16); --bdc-text: #F5D400;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

/* ── PIN ─────────────────────────────────────── */
#pin-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 100; }
.pin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 52px 44px; width: 380px; text-align: center; box-shadow: var(--shadow-lg); }
.pin-logo { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 24px; margin-bottom: 6px; letter-spacing: -0.5px; }
.pin-logo span { color: var(--accent); }
.pin-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 40px; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 32px; }
.pin-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--border); background: transparent; transition: all 0.2s; }
.pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
.pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pin-key { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 20px; font-weight: 500; padding: 18px; cursor: pointer; transition: all 0.12s; font-family: 'Inter', sans-serif; }
.pin-key:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.pin-key:active { transform: scale(0.94); }
.login-switch { margin-top: 20px; }
.login-switch a { color: var(--text-dim); font-size: 12px; text-decoration: none; }
.login-switch a:hover { color: var(--accent); text-decoration: underline; }
.param-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.param-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
.param-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 8px 6px 14px; font-size: 12px; font-weight: 600; }
.param-chip button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 50%; }
.param-chip button:hover { color: var(--red); background: var(--red-dim); }
.param-sep { height: 1px; background: var(--border-soft); margin: 4px 0; }
.param-table { display: flex; flex-direction: column; gap: 8px; }
.param-row { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12px; flex-wrap: wrap; }
.param-row .pr-name { font-weight: 700; min-width: 140px; }
.param-row .pr-email { color: var(--text-dim); min-width: 180px; }
.param-row .pr-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.param-row select.form-select { width: auto; font-size: 12px; padding: 5px 24px 5px 8px; background-position: right 10px center, right 5px center; }
/* Étiquette permanente au-dessus de chaque select (Rôle / Équipe de vente /
   Équipe édito) — avant, seul un `title` au survol distinguait ces 3 menus
   posés côte à côte, il fallait deviner ou survoler chacun pour comprendre
   à quoi il correspond (relevé dans l'audit UX). */
.pr-field { display: flex; flex-direction: column; gap: 2px; }
.pr-field-label { font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
/* Rétroplanning communication (v1) — canal + statut d'un post. */
.social-channel { font-weight: 700; min-width: 90px; }
.social-date { color: var(--text-dim); min-width: 90px; }
.social-title { flex: 1 1 200px; }
.social-status { border: none; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
.social-status.a_faire { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.social-status.pret { background: var(--bdc-bg); color: var(--bdc-text); }
.social-status.publie { background: var(--green-dim); color: var(--green); }
/* Sous-onglets Calendrier/Liste — même pilule que .app-switch. */
.social-subnav { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
.social-subnav-btn { border: none; background: none; font-size: 12px; font-weight: 600; color: var(--text-dim); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-family: inherit; }
.social-subnav-btn.active { background: var(--accent); color: #fff; }
.social-subview { display: none; }
.social-subview.active { display: block; }
/* Grille calendrier mensuelle du rétroplanning. Le MOIS AFFICHÉ reste propre à
   ce calendrier (socialCalendarDate), distinct de celui des diffusions
   (currentDate) : les deux fonctionnalités n'ont aucun rapport, et les coupler
   permettrait à un compte communication de pousser le planning de diffusion
   au-delà de son horizon de visibilité. En revanche le CONTRÔLE est unique —
   .month-nav dans le header pilote celui des deux calendriers qui est affiché
   (cf. changeMonth / updateMonthLabel). Les anciennes règles .social-cal-header
   et .social-cal-title ont disparu avec la navigation en doublon. */
.social-cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 0 2px 6px; text-align: center; }
.social-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.social-cal-day { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 6px; min-height: 92px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.social-cal-day:hover { border-color: var(--accent); }
.social-cal-day.outside { opacity: 0.35; }
.social-cal-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.social-cal-daynum { font-size: 11px; font-weight: 700; color: var(--text-muted); }
.social-cal-chip { font-size: 10px; padding: 3px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.social-cal-chip.Instagram { border-left-color: #E1306C; }
.social-cal-chip.LinkedIn { border-left-color: #0A66C2; }
.social-cal-chip.YouTube { border-left-color: #FF0000; }
.social-cal-chip.Newsletter { border-left-color: var(--accent); }
/* Zoom façon Google Agenda (Semaine / 3 jours / Journée) : mêmes cases, en plus grand */
.social-cal-grid.zoomed { gap: 10px; }
.social-cal-grid.zoomed .social-cal-day { min-height: 320px; padding: 10px; gap: 6px; }
.social-cal-grid.zoomed .social-cal-daynum { font-size: 13px; }
.social-cal-grid.zoomed .social-cal-chip { font-size: 12px; padding: 5px 8px; white-space: normal; line-height: 1.3; }
.social-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; flex-shrink: 0; }
.social-dot.a_faire { background: var(--text-muted); }
.social-dot.pret { background: var(--bdc-text); }
.social-dot.publie { background: var(--green); }
.social-full-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 14px 16px; cursor: pointer; margin-bottom: 10px; }
.social-full-card:hover { border-color: var(--accent); }
.social-full-card.Instagram { border-left-color: #E1306C; }
.social-full-card.LinkedIn { border-left-color: #0A66C2; }
.social-full-card.YouTube { border-left-color: #FF0000; }
/* Aperçu du rendu du post par réseau — mockups légers, pas de vraies images
   (on n'a qu'un lien Drive, pas d'upload) : un cadre placeholder suffit pour
   se projeter sur la mise en page. */
.social-preview-frame { max-width: 360px; margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; color: #111; }
.social-preview-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.social-preview-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.social-preview-name { font-weight: 700; font-size: 13px; }
.social-preview-sub { font-size: 11px; color: #6b7280; }
.social-preview-media { background: #e5e7eb; color: #9ca3af; display: flex; align-items: center; justify-content: center; font-size: 32px; }
.social-preview-body { padding: 10px 12px; font-size: 13px; line-height: 1.5; }
.social-preview-icons { display: flex; gap: 14px; padding: 8px 12px; color: #6b7280; font-size: 16px; border-top: 1px solid #f0f0f0; }
.social-preview-link { display: block; padding: 8px 12px; font-size: 11px; color: var(--accent); text-decoration: none; border-top: 1px solid #f0f0f0; }
.list-filter-row th { padding: 4px 8px 10px; font-weight: 400; }
.list-filter-input { font-size: 11px !important; padding: 5px 8px !important; width: 100%; min-width: 70px; }
.list-filter-reset { font-size: 11px; color: var(--accent); cursor: pointer; text-decoration: underline; white-space: nowrap; margin-left: 8px; }
/* Filtres multi-sélection de la vue Liste (Média, Semaine, Format, Resp. édito, Statut) —
   permet de cocher plusieurs valeurs à la fois au lieu d'un select mono-valeur. */
.ms-filter-btn { text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms-filter-btn.ms-filter-active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
/* Menu unique en position:fixed (repositionné en JS au clic), placé hors du
   tableau pour ne pas être rogné par le overflow:hidden de .table-card. */
.ms-filter-menu { min-width: 170px; max-width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); z-index: 500; max-height: 260px; overflow-y: auto; padding: 6px; }
.ms-filter-item { display: flex; align-items: center; gap: 8px; padding: 6px 6px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 6px; white-space: nowrap; }
.ms-filter-item:hover { background: var(--surface2); }
.ms-filter-item input { flex-shrink: 0; }
.ms-filter-sep { height: 1px; background: var(--border-soft); margin: 4px 2px; }
.ms-filter-clear { display: block; width: 100%; background: none; border: none; color: var(--accent); font-size: 11px; font-weight: 600; text-align: left; padding: 6px; cursor: pointer; border-radius: 6px; }
.ms-filter-clear:hover { background: var(--surface2); }
.ms-filter-empty { padding: 8px 6px; font-size: 11px; color: var(--text-muted); }
.sortable-th { cursor: pointer; user-select: none; }
.sortable-th:hover { color: var(--accent); }
.sort-arrow { display: inline-block; margin-left: 4px; font-size: 10px; color: var(--accent); }
.pin-key.del { font-size: 15px; color: var(--text-dim); }
.pin-error { color: var(--red); font-size: 12px; margin-top: 18px; min-height: 18px; font-weight: 500; }

/* ── APP ─────────────────────────────────────── */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* ── HEADER ──────────────────────────────────── */
header {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px; min-height: 68px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(16,26,46,0.04);
  position: sticky; top: 0; z-index: 50;
}
.header-brand { display: flex; align-items: center; gap: 11px; }
.header-mark { width: 4px; height: 27px; border-radius: 3px; background: var(--accent); flex-shrink: 0; }
.header-text { display: flex; flex-direction: column; gap: 1px; }
.header-logo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.4px; white-space: nowrap; color: var(--text); line-height: 1.25; text-transform: uppercase; }
.header-eyebrow { font-size: 12px; letter-spacing: 0.6px; font-weight: 800; color: var(--text); text-transform: uppercase; line-height: 1.25; }
.header-sep { width: 1px; height: 30px; background: var(--border); }
.role-badge { font-size: 10px; font-weight: 700; padding: 4px 11px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.6px; }
.role-badge.edit { background: var(--gold-dim); color: var(--gold); }
.role-badge.sales { background: var(--accent-dim); color: var(--accent); }
.role-badge.com { background: var(--green-dim); color: var(--green); }
.role-badge.admin { background: rgba(139,92,246,0.16); color: #8b5cf6; }
.header-nav { display: inline-flex; align-items: center; gap: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 13px; padding: 4px; }
.nav-btn { background: none; border: none; color: var(--text-dim); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 9px; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; }
.nav-btn:hover { color: var(--text); }
.nav-btn.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
/* ===== APP SWITCH (navigation majeure Dashboard / Planning) =====
   Même langage visuel que .header-nav juste au-dessus (pastille arrondie,
   mêmes tailles) mais fond plein + blanc à l'état actif pour bien marquer
   qu'il s'agit du niveau "application", au-dessus des sous-onglets Calendrier/
   Liste/etc. Mêmes noms de classe que côté dashboard React (client/src/
   styles.css) pour une apparence identique des deux côtés du portail. */
.app-switch { display: inline-flex; align-items: center; gap: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 13px; padding: 4px; }
.app-switch-btn { background: none; border: none; color: var(--text-dim); font-size: 13px; font-weight: 700; padding: 7px 16px; border-radius: 9px; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; white-space: nowrap; }
.app-switch-btn:hover { color: var(--text); }
.app-switch-btn.active { background: var(--accent); color: #fff; cursor: default; }
@media (max-width: 640px) { .app-switch-btn { padding: 7px 10px; } }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.month-nav { display: inline-flex; align-items: center; gap: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 13px; padding: 4px; }
.month-nav button { background: none; border: none; color: var(--text-dim); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: 15px; transition: all 0.12s; display: flex; align-items: center; justify-content: center; }
.month-nav button:hover { background: var(--surface); color: var(--accent); }
.month-label { font-size: 13px; font-weight: 700; min-width: 118px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
.btn-primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; }
.btn-primary:hover { background: var(--accent-light); }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(220,38,38,0.2); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
.btn-danger:hover { background: rgba(220,38,38,0.16); }
.btn-hard-delete { background: none; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); width: 36px; height: 36px; padding: 0; font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.btn-hard-delete:hover { color: var(--red); border-color: rgba(220,38,38,0.3); background: var(--red-dim); }
.btn-icon { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.btn-icon:hover { border-color: var(--accent-light); background: var(--surface2); }
.btn-icon:active { transform: scale(0.94); }

/* ── TOOLBAR ─────────────────────────────────── */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px rgba(16,26,46,0.04); }
.search-wrap { position: relative; flex: 1; max-width: 300px; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
.search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 7px 12px 7px 32px; font-family: 'Inter', sans-serif; transition: all 0.15s; }
.search-input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-dim); }
.filter-chip { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 500; color: var(--text-dim); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.filter-chip:hover { border-color: var(--bdc); color: var(--bdc-text); }
.filter-chip.active { background: var(--bdc-bg); border-color: var(--bdc); color: var(--bdc-text); }
.filter-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bdc); }
/* Burger mobile (header) — caché par défaut, activé uniquement dans le bloc
   RESPONSIVE MOBILE en fin de feuille de style (voir commentaire là-bas pour
   l'explication de l'ordre des règles). .toolbar-extra en display:contents
   sur desktop : ses enfants se comportent comme s'ils étaient posés
   directement dans .toolbar, aucun changement visuel. */
.planning-burger-btn { display: none; }
.toolbar-extra { display: contents; }
#retard-badge { background: var(--red-dim); border-color: rgba(220,38,38,0.3); color: var(--red); font-weight: 700; }
#retard-badge:hover { background: rgba(220,38,38,0.15); }

/* ── VIEWS ───────────────────────────────────── */
.view { display: none; padding: 24px; }
.view.active { display: block; }

/* ── SEMAINE POPUP (pills) ──────────────────────────── */
.semaine-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.semaine-pill { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 12px; font-size: 12px; box-shadow: var(--shadow); }
.semaine-pill .pill-date { font-weight: 600; color: var(--accent); font-size: 11px; margin-bottom: 1px; }
.semaine-pill .pill-name { color: var(--text); font-size: 12px; }

/* ── MEDIA TABS ──────────────────────────────── */
.media-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }

.semaine-fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 50;
  background: var(--accent); color: #fff; border: none; border-radius: 999px;
  padding: 12px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 6px;
  transition: transform 0.15s;
}
.semaine-fab:hover { transform: translateY(-2px); }

.side-panels-wrap {
  /* --header-stack-height est mesuré en JS (header + barre d'onglets
     Dashboard/Planning au-dessus) pour ne pas se retrouver caché derrière —
     100px en repli le temps que le JS calcule la vraie valeur. */
  position: fixed; top: calc(var(--header-stack-height, 100px) + 20px); right: 20px; width: 240px;
  z-index: 40; display: flex; flex-direction: column; gap: 14px;
}
.a-programmer-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 12px;
}
.a-programmer-panel-title { font-weight: 700; font-size: 12px; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
#aprogrammer-cards-wrap { max-height: calc(100vh - var(--header-stack-height, 100px) - 160px); overflow-y: auto; }
.a-programmer-card {
  background: var(--surface2); border: 1px solid var(--border);
  box-shadow: inset 3px 0 0 var(--accent);
  border-radius: var(--radius-sm); padding: 8px 10px 8px 12px; margin-bottom: 8px; cursor: grab; font-size: 12px;
}
.a-programmer-card:active { cursor: grabbing; opacity: 0.6; }
.a-programmer-card .adc-entreprise { font-weight: 600; }
.a-programmer-card .adc-media { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.a-programmer-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px 0; }
.cal-day.drag-over { outline: 2px dashed #ff9900; outline-offset: -2px; background: #ff990011; }
.a-programmer-panel.drag-over-panel { outline: 2px dashed var(--accent); outline-offset: -3px; background: rgba(37,99,235,0.08); }

/* Boîte à idées (rétroplanning réseaux sociaux) — même contenu que le panneau
   "À programmer" (cartes glissables), mais en popover ancré sous un bouton de
   la barre d'outils plutôt qu'en panneau latéral fixe sous le header : sur cet
   onglet, cette zone est déjà occupée par la barre d'outils du calendrier
   social (+ Ajouter un post, filtre canaux, zoom Mois/Semaine/3 jours/
   Journée), d'où le chevauchement visuel avec un panneau toujours affiché
   qui reproduisait tel quel le calcul de position d'"À programmer". */
.idea-box-menu {
  position: fixed; width: 280px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 12px;
  z-index: 500;
}
.idea-box-panel-title { font-weight: 700; font-size: 12px; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
#idea-box-cards-wrap { max-height: 320px; overflow-y: auto; }
.idea-box-card {
  background: var(--surface2); border: 1px solid var(--border);
  box-shadow: inset 3px 0 0 var(--accent);
  border-radius: var(--radius-sm); padding: 8px 24px 8px 12px; margin-bottom: 8px;
  cursor: grab; font-size: 12px; position: relative;
}
.idea-box-card:active { cursor: grabbing; opacity: 0.6; }
.idea-box-card .idc-title { font-weight: 600; cursor: text; border-radius: 4px; padding: 1px 3px; margin: -1px -3px; }
.idea-box-card .idc-title:hover { background: rgba(79,110,247,0.1); }
.idea-box-card .idc-title-input {
  font: inherit; font-weight: 600; width: 100%; box-sizing: border-box;
  border: 1px solid var(--accent); border-radius: 4px; padding: 1px 3px; margin: -1px -3px;
  background: var(--surface); color: var(--text);
}
.idea-box-card .idc-del {
  position: absolute; top: 6px; right: 8px; cursor: pointer; color: var(--text-muted);
  font-size: 13px; line-height: 1;
}
.idea-box-card .idc-del:hover { color: #dc2626; }
.idea-box-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px 0; }
.idea-box-add-row { display: flex; gap: 6px; margin-top: 10px; }
.idea-box-add-row input {
  flex: 1; min-width: 0; font-size: 12px; padding: 6px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
}
.idea-box-add-row button {
  font-size: 12px; padding: 6px 10px; border-radius: var(--radius-sm); border: none;
  background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap;
}
/* Canaux visés par une idée (Instagram/LinkedIn/YouTube/Newsletter, mêmes
   valeurs que les posts déjà publiés — cf. CHANNELS côté serveur) : badges
   en lecture seule sur la carte, ou petits boutons à cocher/décocher en
   édition (nouvelle idée ou modification d'une idée existante). */
.idc-channels { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.idc-channel-chip {
  font-size: 11px; padding: 2px 6px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-dim); cursor: pointer; line-height: 1.4;
}
.idc-channel-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.idea-box-add-row-wrap { margin-top: 10px; }
.social-cal-day.drag-over-idea { outline: 2px dashed var(--accent); outline-offset: -2px; background: rgba(37,99,235,0.08); }
.media-tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow); }
.media-tab:hover { color: var(--text); border-color: var(--text-muted); }
.media-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(79,110,247,0.3); }
@keyframes strawberryFall {
  0% { transform: translateY(-10vh) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}
.strawberry-drop {
  position: fixed; top: 0; z-index: 9999; pointer-events: none;
  animation-name: strawberryFall; animation-timing-function: linear; animation-fill-mode: forwards;
}

/* ── CALENDRIER ──────────────────────────────── */
.calendar-grid {
  display: grid;
  grid-template-columns: 52px repeat(3, 1fr);
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: var(--border);
}
/* Option "afficher mardi/jeudi" (jours non diffusés) — 5 colonnes au lieu de 3 */
.calendar-grid.marjeu { grid-template-columns: 52px repeat(5, 1fr); }
.cal-day.non-diffusable {
  background: repeating-linear-gradient(45deg, rgba(127,127,127,0.06) 0 8px, transparent 8px 16px);
}
.cal-day.non-diffusable .cal-day-num { color: var(--text-muted); }
.nd-label {
  font-size: 9px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.6px; text-align: center; margin-top: 6px;
}
/* Le toggle, tout petit en bas à gauche de l'écran */
.marjeu-toggle {
  position: fixed; bottom: 10px; left: 10px; z-index: 45;
  font-size: 10.5px; padding: 4px 9px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text-muted); cursor: pointer; opacity: 0.7; font-family: inherit;
}
.marjeu-toggle:hover { opacity: 1; color: var(--text); }
.cal-header {
  background: var(--surface2); padding: 10px 14px;
  font-size: 11px; font-weight: 700; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.8px;
}
.cal-week-label {
  background: var(--surface2); display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.3px;
}
.cal-day {
  background: var(--surface); padding: 10px; min-height: 110px;
  transition: background 0.1s;
}
.cal-day.ferie { background: #fef2f2; }
[data-theme="dark"] .cal-day.ferie { background: rgba(220,38,38,0.05); }
.cal-day.vide { background: var(--surface2); }
.cal-day-header { display: flex; align-items: center; margin-bottom: 8px; gap: 6px; }
.cal-day-num {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.cal-day-num.today { background: var(--accent); color: #fff; }
.cal-day-badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.badge-ferie { background: #fee2e2; color: var(--red); }
.badge-slots { margin-left: auto; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.badge-slots.complet { background: #fee2e2; color: var(--red); border-color: rgba(220,38,38,0.2); }
.badge-slots.presque { background: var(--bdc-bg); color: var(--bdc-text); border-color: rgba(245,212,0,0.4); }

/* ── EMISSION CARD ───────────────────────────── */
.emission-card {
  border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 6px;
  cursor: pointer; transition: all 0.15s;
  border: 1px solid var(--border);
  background: var(--surface);
  position: relative; overflow: hidden;
}
.emission-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 0;
}
.emission-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.emission-card[draggable="true"] { cursor: grab; }
.emission-card[draggable="true"]:active { cursor: grabbing; opacity: 0.6; }
.ec-plateau::before { background: var(--plateau); }
.ec-immersion::before { background: var(--immersion); }
.ec-artdigital::before { background: var(--artdigital); }
.ec-artprint::before { background: var(--artprint); }
.ec-bdc { background: var(--bdc-bg) !important; border-color: rgba(245,212,0,0.3) !important; }
.ec-bdc::before { background: var(--bdc); }
.ec-annule { opacity: 0.4; }
.ec-entreprise { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
.ec-detail { font-size: 11px; color: var(--text-dim); margin-top: 2px; padding-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ec-footer { display: flex; gap: 4px; margin-top: 5px; padding-left: 6px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.chip-plateau { background: var(--plateau-bg); color: var(--plateau); }
.chip-immersion { background: var(--immersion-bg); color: var(--immersion); }
.chip-artdigital { background: var(--artdigital-bg); color: var(--artdigital); }
.chip-artprint { background: var(--artprint-bg); color: var(--artprint); }
.chip-bdc { background: var(--bdc-bg); color: var(--bdc-text); }
.chip-hp { background: #fef3c7; color: #92400e; }
.chip-grey { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
.decale-icon { font-size: 10px; color: var(--bdc-text); margin-left: 2px; }
.add-slot-btn {
  width: 100%; padding: 6px; background: none;
  border: 1px dashed var(--border); border-radius: var(--radius-sm);
  color: var(--text-muted); font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; margin-top: 4px;
  font-family: 'Inter', sans-serif;
}
.add-slot-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

/* ── LISTE ───────────────────────────────────── */
.stats-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.stat-pill-val { font-size: 20px; font-weight: 700; }
.stat-pill-lbl { font-size: 11px; color: var(--text-dim); font-weight: 500; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
thead th { background: var(--surface2); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
td { padding: 10px 14px; font-size: 13px; }
.td-bdc { background: var(--bdc-bg) !important; }
.fmt-strip { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

/* ── REPORTING ───────────────────────────────── */
.report-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

/* ── SÉLECTEUR DE PÉRIODE (Reporting) ─────────────────────────────────────── */
.period-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-sm); padding: 9px 14px;
  font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.period-btn:hover { border-color: var(--accent); background: var(--surface2); }
.period-caret { font-size: 10px; color: var(--text-dim); }
.period-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 50;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 6px; min-width: 220px;
  box-shadow: var(--shadow-lg);
}
.period-item {
  display: block; width: 100%; background: none; border: none; color: var(--text);
  padding: 10px 12px; border-radius: 8px; font-size: 13px; text-align: left;
  font-family: 'Inter', sans-serif; cursor: pointer; transition: background 0.12s;
}
.period-item:hover { background: var(--surface2); }
.period-item.active { color: var(--accent); font-weight: 700; }
.period-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.period-custom { padding: 10px 8px 8px; min-width: 240px; }
.period-custom-title {
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding: 0 4px;
}
.period-field { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 4px; }
.period-field span { font-size: 12px; color: var(--text-dim); width: 24px; }
.period-field input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 8px 10px;
  font-size: 13px; font-family: 'Inter', sans-serif; outline: none;
}
.period-field input:focus { border-color: var(--accent); }
.period-custom-actions { display: flex; gap: 8px; margin-top: 14px; padding: 0 4px; }
.period-cancel {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 8px; padding: 9px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
}
.period-cancel:hover { background: var(--border); }
.period-apply {
  flex: 1; background: var(--accent); border: none; color: #fff;
  border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'Inter', sans-serif;
}
.period-apply:hover { background: var(--accent-light); }
.report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.kpi-eyebrow { display: flex; align-items: center; gap: 7px; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--text-dim); margin-bottom: 10px; }
.kpi-eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--accent); }
/* Titres de section Paramètres — même structure que .kpi-eyebrow (puce +
   libellé) mais sans MAJUSCULES/letter-spacing : posé en haut de 6-7 cartes
   empilées sur la même page, la version toute-capitales devenait lourde à
   la longue (relevé dans l'audit UX). Casse normale + un peu plus de poids
   suffit à structurer sans "crier". */
.param-section-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text); }
.param-section-title .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--accent); }
.kpi-val { font-family: 'Sora', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; }
.kpi-lbl { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.media-table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.ca-bar-wrap { margin-top: 5px; background: var(--surface2); border-radius: 4px; height: 4px; overflow: hidden; }
.ca-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #818cf8); border-radius: 4px; transition: width 0.6s ease; }

/* ── MODAL ───────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(2,6,15,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(6px); }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal-header { display: flex; align-items: center; padding: 20px 24px 16px; border-bottom: 1px solid var(--border-soft, var(--border)); }
.modal-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
.modal-close { margin-left: auto; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 24px; border-top: 1px solid var(--border-soft, var(--border)); background: var(--surface2); border-radius: 0 0 18px 18px; }
.modal-footer-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input, .form-select, .form-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; padding: 8px 12px; transition: all 0.15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-dim); }
.form-input:disabled, .form-select:disabled, .form-textarea:disabled { opacity: 0.6; cursor: not-allowed; }
/* Sans appearance:none, un <select> garde le rendu natif du système (Safari
   iOS surtout) par-dessus notre style — d'où la grosse pilule ovale bien plus
   haute que les boutons voisins vue sur mobile. On reprend un chevron custom
   (double dégradé, pas de SVG à encoder) pour un rendu identique partout. */
.form-select {
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-color: var(--surface2);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
    linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position: right 15px center, right 10px center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
}
.form-textarea { min-height: 72px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
/* Un bouton posé à côté d'un champ dans une .form-row hérite sinon du stretch
   par défaut de la grille et s'étire sur toute la largeur de sa colonne (ex:
   "Enregistrer"/"Importer"/"+ Ajouter" dans Paramètres) — on le garde à sa
   largeur naturelle, aligné en bas comme le champ à côté. */
.form-row > .btn-primary, .form-row > .btn-secondary { justify-self: start; align-self: end; }
.bdc-editor { display: grid; grid-template-columns: minmax(340px, 480px) 1fr; gap: 24px; align-items: start; max-width: 1320px; }
.bdc-form-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
@media (max-width: 980px) { .bdc-editor { grid-template-columns: 1fr; } }
.bdc-preview-col { position: sticky; top: 24px; }
.bdc-preview-wrap { position: relative; width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.bdc-preview-wrap iframe { position: absolute; top: 0; left: 0; width: 794px; height: 1123px; border: 0; background: #fff; transform-origin: top left; }
.desc-item-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.desc-item-row .form-input { flex: 1; }
.desc-item-row button { flex: 0 0 auto; width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface2); border-radius: 8px; cursor: pointer; color: #EF4444; font-size: 16px; line-height: 1; }
.checkbox-group { display: flex; gap: 16px; }
.checkbox-label { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
.checkbox-label input { accent-color: var(--accent); width: 15px; height: 15px; }
.info-banner { display: flex; align-items: flex-start; gap: 9px; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; font-weight: 500; margin-bottom: 16px; }
.info-banner.neutral { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); }
.info-banner.bdc { background: var(--bdc-bg); border: 1px solid rgba(245,212,0,0.45); color: var(--bdc-text); }
/* Suivi des envois DocuSign (vue BDC) */
.ds-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.ds-chip { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.ds-chip.envoye { background: var(--bdc-bg); color: var(--bdc-text); }
.ds-chip.signe { background: var(--green-dim); color: var(--green); }
.ds-chip.refuse, .ds-chip.annule { background: var(--surface2); color: var(--red); border: 1px solid var(--border); }
.info-banner.warning { background: var(--bdc-bg); border: 1px solid rgba(245,212,0,0.35); color: var(--bdc-text); }

/* ── TOAST ───────────────────────────────────── */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; max-width: 380px; box-shadow: var(--shadow-lg); z-index: 300; animation: toastIn 0.25s ease; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
.toast.warning { border-color: rgba(217,119,6,0.4); }
.toast.success { border-color: rgba(22,163,74,0.4); }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── RESPONSIVE MOBILE ─────────────────────────────────────────────────────
   Bloc volontairement placé en tout dernier dans la feuille de style : à
   spécificité égale (sélecteurs simples, pas d'id ni de !important), c'est
   l'ORDRE d'apparition qui tranche en CSS, pas la présence d'un @media — un
   bloc mobile placé plus haut dans le fichier peut donc se faire silencieusement
   écraser par une règle "normale" déclarée plus bas (c'est ce qui est arrivé au
   panneau "À programmer", au calendrier et aux formulaires : leurs règles de
   base, ajoutées après coup plus loin dans le fichier, gagnaient toujours sur
   mobile). En le mettant ici, ce bloc gagne toujours, quoi qu'on ajoute au-dessus. */
@media (max-width: 768px) {
  .side-panels-wrap {
    position: static; width: 100%; margin-bottom: 16px;
    top: auto; right: auto;
  }
  #aprogrammer-cards-wrap { max-height: 160px; }
  .semaine-fab { bottom: 16px; right: 16px; padding: 10px 14px; font-size: 12px; }
  .period-menu { right: -60px; min-width: 200px; }
  /* Le header empilait jusqu'à 4 lignes avant d'arriver au vrai contenu
     (marque OpenMedias, badge de rôle, mois + icônes, sous-menu) — beaucoup
     trop haut sur un écran de téléphone. On retire le bloc de marque
     "OpenMedias / Planning de diffusion" (redondant : l'onglet "📅 Planning"
     dit déjà où on est) et on regroupe le reste sur 2 lignes au lieu de 4 :
     ligne 1 = onglets Dashboard/Planning/Paramètres + badge de rôle,
     ligne 2 = mois/icônes/+Ajouter, ligne 3 = sous-menu Calendrier/Liste/... */
  header { flex-wrap: wrap; height: auto; padding: 8px 14px; row-gap: 6px; }
  .header-brand, .header-sep { display: none; }
  .app-switch { order: 1; }
  .role-badge { order: 2; margin-left: auto; }
  .header-right { order: 3; width: 100%; flex-wrap: wrap; gap: 6px; }
  .header-nav { order: 4; width: 100%; margin-top: 0; }
  .month-label { min-width: 90px; font-size: 12px; }
  .report-grid { grid-template-columns: 1fr 1fr; }

  /* Bandeau médias (TIME/BFMTV/...) : une seule ligne qui scrolle plutôt que
     de retourner à la ligne sur 2-3 rangées et bouffer l'écran en hauteur. */
  .media-tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .media-tab { flex: 0 0 auto; }

  /* Calendrier : les colonnes Lundi/Mercredi/Vendredi gardent une largeur
     lisible (200px) au lieu de s'écraser à ~110px — on scrolle latéralement
     pour voir les 3 jours plutôt que tout entasser. La colonne "S1/S2..."
     reste épinglée à gauche pour toujours savoir sur quelle semaine on est. */
  #calendar-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .calendar-grid { grid-template-columns: 52px repeat(3, 200px); width: max-content; }
  .calendar-grid.marjeu { grid-template-columns: 52px repeat(5, 200px); }
  .cal-week-label { position: sticky; left: 0; z-index: 2; }

  /* Liste : le tableau devient une pile de cartes (une diffusion = une carte)
     plutôt qu'un tableau à 10 colonnes illisible sans scroll latéral. Les
     en-têtes de colonnes/filtres disparaissent (la recherche de la barre du
     haut reste disponible) ; chaque cellule affiche son étiquette via
     data-label (voir renderListRows). */
  #view-list table, #view-list tbody, #view-list tr, #view-list td { display: block; width: 100%; }
  #view-list thead { display: none; }
  #view-list tbody tr {
    margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; background: var(--surface); box-shadow: var(--shadow);
  }
  #view-list tbody td { border: none; padding: 3px 0; max-width: none !important; white-space: normal !important; }
  #view-list tbody td[data-label]::before {
    content: attr(data-label); display: inline-block; min-width: 100px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--text-muted); vertical-align: top;
  }

  /* Formulaires (modale émission, BDC, comptes...) : un champ par ligne au
     lieu de 2 champs côte à côte qui deviennent trop étroits pour être saisis
     confortablement au clavier tactile. */
  .form-row { grid-template-columns: 1fr; }

  /* Zoom auto au focus (iOS ET Android) : les navigateurs mobiles zooment
     automatiquement sur un champ dont le texte fait moins de 16px, puis ne
     dézooment pas forcément après — d'où l'impression que "la page n'est
     plus fixe". Tous les champs (form-input/select/textarea, filtres de la
     Liste, selects de Paramètres...) étaient entre 11px et 13px. En les
     remontant à 16px sur mobile, le zoom automatique ne se déclenche plus. */
  input, select, textarea { font-size: 16px !important; }
  .list-filter-input { font-size: 16px !important; }
  .param-row select.form-select { font-size: 16px !important; }

  /* Menu burger : header-right (mois + actions) et toolbar-extra (filtres/
     badges secondaires) sont cachés par défaut et regroupés dans un seul
     panneau déroulant ouvert via le bouton ☰ — ne restent visibles en
     permanence que la navigation (app-switch/header-nav) et la recherche. */
  .planning-burger-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; margin-left: 8px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 16px; cursor: pointer; order: 2;
  }
  .header-right { display: none; }
  .toolbar-extra { display: none; }
  body.planning-menu-open .header-right {
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    width: 100%; order: 5;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; margin-top: 4px;
  }
  body.planning-menu-open .header-right .month-nav { justify-content: center; }
  body.planning-menu-open .toolbar-extra {
    display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 100%;
  }
  body.planning-menu-open .toolbar-extra .form-select { width: 100%; }

  /* Paramètres — lignes "Comptes/Équipes/Salesforce" (.param-row) : jusqu'à
     3 selects + 4 boutons icône posés côte à côte dans .pr-actions, qui ne
     passait jamais à la ligne (pas de flex-wrap) — débordait hors écran sur
     mobile, surtout depuis que les selects sont passés à 16px (fix anti-zoom
     ci-dessus). On empile nom/email/actions comme une carte, et les actions
     elles-mêmes passent à la ligne au besoin. */
  .param-row { flex-direction: column; align-items: stretch; }
  .param-row .pr-name, .param-row .pr-email { min-width: 0; width: 100%; }
  .param-row .pr-actions { margin-left: 0; width: 100%; flex-wrap: wrap; }
  .param-row .pr-actions .pr-field { flex: 1 1 110px; }
  .param-row .pr-actions .pr-field select.form-select { width: 100%; }
}

.role-badge.finance { background: rgba(13,148,136,0.16); color: #0d9488; }

/* ── RECOUVREMENT (Pennylane) ────────────────────── */
.finance-days-late { font-weight: 700; }
.finance-days-late.late { color: #dc2626; }
.finance-days-late.ok { color: var(--text-muted); font-weight: 500; }
.finance-inline-select { font-size: 12px; padding: 4px 22px 4px 8px; }
.finance-relance-entry { border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 12px; }
.finance-relance-entry:last-child { border-bottom: none; }
.finance-relance-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.finance-aging-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin-top: 8px; background: var(--surface2); }
.finance-aging-seg { height: 100%; }
.finance-aging-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 11px; color: var(--text-dim); }
.finance-aging-legend span.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.finance-invoice-link { font-weight: 700; color: var(--accent); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; font-size: inherit; font-family: inherit; }
.finance-retard-wrap { min-width: 92px; }
.finance-retard-bar { height: 6px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.finance-retard-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
.finance-retard-label { font-size: 10px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; }
.finance-detail-section { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
.finance-detail-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.finance-installment-row { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding: 7px 0; font-size: 12px; }
.finance-installment-row:last-child { border-bottom: none; }
.finance-installment-row.paid { opacity: 0.55; text-decoration: line-through; }

/* Barre d'onglets de classement (façon Pennylane : "Toutes 4298 / À traiter 73
   / À venir 24 / En retard 244 / Plus (4)") — remplace l'ancien select de
   statut + case "en retard uniquement" par des chips cliquables avec compteur
   en direct depuis le cache local. Le compteur "Toutes" sert aussi de repère
   rapide pour vérifier que la synchro a bien ramené ce qui était attendu. */
.finance-tabs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px; box-shadow: var(--shadow); margin-bottom: 14px; }
.finance-tab { display: inline-flex; align-items: center; gap: 7px; background: none; border: none; color: var(--text-dim); font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; white-space: nowrap; }
.finance-tab:hover { background: var(--surface2); color: var(--text); }
.finance-tab.active { background: var(--accent-dim); color: var(--accent); }
.finance-tab-count { background: var(--surface2); color: var(--text-dim); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.finance-tab.active .finance-tab-count { background: var(--accent); color: #fff; }
.finance-tab-more-select { margin-left: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text-dim); font-size: 13px; font-weight: 700; padding: 8px 28px 8px 14px; cursor: pointer; font-family: 'Inter', sans-serif; }
.finance-tab-more-select.active { background: var(--accent-dim); color: var(--accent); border-color: transparent; }

/* Filtre de période (Tout/Semaine/Mois/Année) sur la date d'échéance, avec
   navigation précédent/suivant quand une période calendaire est active. */
.finance-period-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.finance-period-modes { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; box-shadow: var(--shadow); }
.finance-period-mode { background: none; border: none; color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; }
.finance-period-mode:hover { background: var(--surface2); color: var(--text); }
.finance-period-mode.active { background: var(--accent-dim); color: var(--accent); }
.finance-period-nav { display: flex; align-items: center; gap: 6px; }
.finance-period-label { font-size: 12px; font-weight: 700; color: var(--text); min-width: 140px; text-align: center; }
</style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-card" id="pin-card-commercial">
    <div class="pin-logo">💶 <span>Recouvrement</span></div>
    <div class="pin-sub">OpenMedias — Connexion</div>
    <div style="text-align:left;margin-top:24px">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="commercial-email" autocomplete="username" onkeydown="if(event.key==='Enter')commercialLoginSubmit()"></div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Mot de passe</label><input class="form-input" type="password" id="commercial-password" autocomplete="current-password" onkeydown="if(event.key==='Enter')commercialLoginSubmit()"></div>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:18px" onclick="commercialLoginSubmit()">Connexion</button>
    <div class="pin-error" id="commercial-login-error"></div>
    <div class="login-switch" style="text-align:right">
      <a href="#" onclick="showForgotPassword(event)">Mot de passe oublié ?</a>
    </div>
  </div>

  <!-- Mot de passe oublié : même flow que le planning (email -> lien de
       réinitialisation via /api/auth/forgot-password, réponse générique
       qu'un compte existe ou non). -->
  <div class="pin-card" id="pin-card-forgot" style="display:none">
    <div class="pin-logo">💶 <span>Recouvrement</span></div>
    <div class="pin-sub">Mot de passe oublié</div>
    <div style="text-align:left;margin-top:24px">
      <div class="form-group"><label class="form-label">Email du compte</label><input class="form-input" type="email" id="forgot-email" autocomplete="username" onkeydown="if(event.key==='Enter')forgotPasswordSubmit()"></div>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:18px" onclick="forgotPasswordSubmit()">Envoyer le lien</button>
    <div class="pin-error" id="forgot-error"></div>
    <div class="info-banner neutral" id="forgot-success" style="display:none;margin-top:14px;text-align:left"></div>
    <div class="login-switch"><a href="#" onclick="hideForgotPassword(event)">← Retour à la connexion</a></div>
  </div>

  <!-- Compte valide mais pas finance/admin : ce compte a une autre page
       d'accueil (dashboard ou planning) — on ne le laisse pas s'installer ici. -->
  <div class="pin-card" id="pin-card-refused" style="display:none">
    <div class="pin-logo">💶 <span>Recouvrement</span></div>
    <div class="pin-sub" id="refused-message">Ce compte n'a pas accès au recouvrement.</div>
    <button class="btn-secondary" style="width:100%;margin-top:18px" onclick="logout()">Retour à la connexion</button>
  </div>
</div>
<script>
  // Anti-flash : même logique que /planning et le dashboard React — si une
  // session existe déjà (commercialId en localStorage), on masque l'écran de
  // connexion tout de suite (avant peinture) plutôt que d'attendre l'aller-
  // retour réseau de /api/auth/me, qui le referait de toute façon disparaître.
  if(localStorage.getItem('commercialId')){
    document.getElementById('pin-screen').style.display='none';
  }
</script>

<div id="app">
  <header>
    <!-- Mêmes 3 destinations que partout ailleurs (Dashboard/Planning/Radar),
         plus l'onglet courant en "actif" — Recouvrement est un gros onglet au
         même niveau que les autres, pas nested dans le planning. -->
    <div class="app-switch">
      <button class="app-switch-btn" onclick="window.location.href='/'" id="app-tab-dashboard">📊 Dashboard</button>
      <button class="app-switch-btn" onclick="window.location.href='/planning'" id="app-tab-planning">📅 Planning</button>
      <button class="app-switch-btn" onclick="window.location.href='/radar'" id="app-tab-radar">📡 Radar</button>
      <button class="app-switch-btn active" id="app-tab-recouvrement">💶 Recouvrement</button>
    </div>
    <div class="header-sep"></div>
    <div class="header-brand">
      <div class="header-mark"></div>
      <div class="header-text">
        <div class="header-eyebrow">OpenMedias</div>
        <div class="header-logo">Recouvrement</div>
      </div>
    </div>
    <div class="header-sep"></div>
    <div class="role-badge" id="role-badge"></div>
    <div class="header-right" id="header-right" style="margin-left:auto">
      <button class="btn-icon" onclick="toggleTheme()" id="theme-btn" title="Thème">☀️</button>
      <button class="btn-icon" onclick="logout()" id="logout-btn" title="Déconnexion">🚪</button>
    </div>
  </header>

  <div class="view active" id="view-finance">
    <div class="report-header">
      <h2 style="font-size:16px;font-weight:700">💶 Recouvrement</h2>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span id="finance-last-sync" style="font-size:11px;color:var(--text-muted)"></span>
        <button class="btn-secondary" id="finance-sync-btn" onclick="syncFinance()">↻ Synchroniser Pennylane</button>
      </div>
    </div>
    <!-- Aperçu de la synchro (tous statuts Pennylane confondus, pas
         seulement les factures dues) : repère de cohérence face au propre
         tableau de bord Pennylane ("Toutes X" / Brouillon / Encaissée /
         Annulée / Avoir…) pour vérifier que la synchro a bien tout ramené —
         cf. renderFinanceSyncOverview(). -->
    <div id="finance-sync-overview" style="font-size:11px;color:var(--text-muted);margin-bottom:14px"></div>
    <div class="report-grid" id="finance-kpis"></div>
    <!-- Filtre de période sur la date d'ÉCHÉANCE (Semaine/Mois/Année,
         périodes calendaires avec navigation précédent/suivant) — restreint
         à la fois les onglets et le tableau ci-dessous. Cf. renderFinancePeriodBar(). -->
    <div class="finance-period-bar" id="finance-period-bar"></div>
    <!-- Barre de classement façon Pennylane (Toutes/À traiter/À venir/En
         retard/Plus, chacun avec son compteur) — cf. renderFinanceTabs(). -->
    <div class="finance-tabs" id="finance-tabs"></div>
    <div class="media-table-card" style="margin-bottom:10px;padding:14px 16px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input class="form-input" style="max-width:280px;flex:1" type="text" id="finance-search" placeholder="N° facture, entreprise ou contact…" oninput="renderFinanceInvoices()">
      </div>
    </div>
    <div class="media-table-card" id="finance-invoices-table" style="overflow-x:auto"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>

<script>
const API = 'api'; // relatif : résout vers /recouvrement/api/... une fois servi sous /recouvrement/

// ── SESSION / LOGIN ──────────────────────────────────────────────────────────
// Réutilise le même système de comptes que le planning et le dashboard
// (commercial_users, mêmes clés localStorage commercialId/commercialNom) —
// pas de second système d'auth à maintenir, et la SSO entre les 3 apps
// continue de fonctionner (login une seule fois, quel que soit le point
// d'entrée).
let commercialId = localStorage.getItem('commercialId') || null;
let commercialNom = localStorage.getItem('commercialNom') || '';
let meta = {};
let isAccountAdmin = false;

// Seuls finance et admin ont leur place ici. Un autre rôle est renvoyé vers
// sa vraie page d'accueil — même logique (inversée) que /planning et le
// dashboard React, qui renvoient déjà 'finance' vers /recouvrement.
function redirectAwayIfNotAllowed(accountRole){
  if(accountRole==='admin'||accountRole==='finance')return false;
  if(accountRole==='edito'||accountRole==='communication'){ window.location.href='/planning'; return true; }
  window.location.href='/';
  return true;
}

function activateSession(d){
  isAccountAdmin = d.accountRole==='admin';
  commercialId=d.commercial_id; commercialNom=d.nom||'';
  localStorage.setItem('commercialId',commercialId); localStorage.setItem('commercialNom',commercialNom);
  document.getElementById('pin-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('role-badge').textContent = isAccountAdmin?'Admin':'Finance';
  document.getElementById('role-badge').className = `role-badge ${isAccountAdmin?'admin':'finance'}`;
  init();
}

// SSO : si un commercialId existe déjà (arrivée depuis le planning ou le
// dashboard, ou onglet précédent), on retente une session silencieuse via
// /api/auth/me plutôt que de redemander les identifiants.
async function tryAutoLogin(){
  if(!commercialId)return false;
  try{
    const r=await fetch(`${API}/auth/me`,{headers:{'x-commercial-id':commercialId}});
    if(!r.ok)throw new Error('session invalide');
    const d=await r.json();
    if(redirectAwayIfNotAllowed(d.accountRole))return true;
    activateSession(d);
    return true;
  }catch{
    // Compte supprimé/désactivé depuis, ou rôle non autorisé ici : on nettoie
    // pour retomber proprement sur l'écran de connexion.
    localStorage.removeItem('commercialId'); localStorage.removeItem('commercialNom');
    commercialId=null; commercialNom='';
    return false;
  }
}

// Pennylane reste la source de vérité facturation (l'app n'y écrit jamais) ;
// cette vue ajoute le suivi de recouvrement par-dessus (statut, historique de
// relances, KPI, commentaires, échéances personnalisées) — remplace l'Excel +
// Trello utilisés jusque-là.
const FINANCE_STATUS_LABEL={a_relancer:'À relancer',en_cours:'En cours',litige:'Litige',promesse_paiement:'Promesse de paiement',solde:'Soldée'};
const FINANCE_STATUS_COLOR={a_relancer:'var(--gold)',en_cours:'var(--accent)',litige:'#dc2626',promesse_paiement:'#0d9488',solde:'var(--green)'};

// Filtre actif de la barre d'onglets (façon Pennylane : Toutes/À traiter/À

// retard uniquement" par des chips cliquables avec compteur en direct.

// Filtre de période (Tout/Semaine/Mois/Année), sur la date d'ÉCHÉANCE de la
// facture, en périodes CALENDAIRES (semaine lundi-dimanche, mois civil,
// année civile) — navigables via financePeriodShift(-1/+1). "Tout" (mode
// par défaut) ne restreint rien : ce filtre est purement un affichage par-
// dessus les données déjà synchronisées, il ne touche jamais à la synchro
// elle-même (on a explicitement retiré tout filtre de date de syncFinance()
// pour éviter que des factures sortent du champ suivi et se figent).
let financePeriodMode='all'; // 'all' | 'week' | 'month' | 'year'
let financePeriodAnchor=new Date(); // date de référence, déplacée par la navigation

function financePeriodBounds(){
  if(financePeriodMode==='all')return null;
  const d=financePeriodAnchor;
  if(financePeriodMode==='week'){
    const dow=(d.getDay()+6)%7; // 0=lundi … 6=dimanche
    const start=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow);
    const end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6,23,59,59,999);
    return {start,end};
  }
  if(financePeriodMode==='month'){
    const start=new Date(d.getFullYear(),d.getMonth(),1);
    const end=new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999);
    return {start,end};
  }
  if(financePeriodMode==='year'){
    const start=new Date(d.getFullYear(),0,1);
    const end=new Date(d.getFullYear(),11,31,23,59,59,999);
    return {start,end};
  }
  return null;
}
function financeMatchesPeriod(inv){
  const bounds=financePeriodBounds();
  if(!bounds)return true;
  if(!inv.deadline)return false; // pas d'échéance (ex. brouillon) : hors période dès qu'une période est active
  const dl=new Date(`${inv.deadline}T00:00:00`);
  return dl>=bounds.start&&dl<=bounds.end;
}
function financePeriodLabel(){
  const bounds=financePeriodBounds();
  if(!bounds)return '';
  if(financePeriodMode==='week'){
    return `${bounds.start.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})} – ${bounds.end.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}`;
  }
  if(financePeriodMode==='month'){
    const s=bounds.start.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  return String(bounds.start.getFullYear());
}
function setFinancePeriodMode(mode){
  financePeriodMode=mode;
  financePeriodAnchor=new Date(); // on repart de "maintenant" à chaque changement de granularité
  renderFinancePeriodBar();
  renderFinanceTabs();
  renderFinanceInvoices();
}
function financePeriodShift(delta){
  const d=new Date(financePeriodAnchor);
  if(financePeriodMode==='week')d.setDate(d.getDate()+delta*7);
  else if(financePeriodMode==='month')d.setMonth(d.getMonth()+delta);
  else if(financePeriodMode==='year')d.setFullYear(d.getFullYear()+delta);
  financePeriodAnchor=d;
  renderFinancePeriodBar();
  renderFinanceTabs();
  renderFinanceInvoices();
}
function renderFinancePeriodBar(){
  const wrap=document.getElementById('finance-period-bar');
  if(!wrap)return;
  const modes=[['all','Tout'],['week','Semaine'],['month','Mois'],['year','Année']];
  const modeBtns=modes.map(([key,label])=>`<button type="button" class="finance-period-mode ${financePeriodMode===key?'active':''}" onclick="setFinancePeriodMode('${key}')">${label}</button>`).join('');
  const nav=financePeriodMode==='all'?'':`
    <div class="finance-period-nav">
      <button type="button" class="btn-icon" onclick="financePeriodShift(-1)" title="Période précédente">‹</button>
      <span class="finance-period-label">${financePeriodLabel()}</span>
      <button type="button" class="btn-icon" onclick="financePeriodShift(1)" title="Période suivante">›</button>
    </div>
  `;
  wrap.innerHTML=`<div class="finance-period-modes">${modeBtns}</div>${nav}`;
}
